<div class="pi-card">
  {{{monogram}}}
  <div class="pi-body">
    <h3 class="person-name">{{name}}</h3>
    <p class="person-meta">{{role}} <span aria-hidden="true">·</span> {{title}}</p>
    {{{bio}}}
    <ul class="pi-links">
      <li><a href="{{website}}" rel="noopener">Personal website</a></li>
      <li><a href="{{scholar}}" rel="noopener">Google Scholar</a></li>
      <li><a href="{{orcid}}" rel="noopener">ORCID</a></li>
      <li><a href="{{linkedin}}" rel="noopener">LinkedIn</a></li>
      <li><a href="mailto:{{email}}">{{email}}</a></li>
    </ul>
  </div>
</div>
