<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{root}}assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
<link rel="stylesheet" href="{{root}}assets/site.css">
<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("reach-theme");if(t==="light"||t==="dark")d.setAttribute("data-theme",t);}catch(err){}})();</script>
</head>
<body class="{{body_class}}">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{home}}">{{{logo}}}</a>
    <div class="header-tools">
      <button class="theme-toggle" type="button" aria-label="Switch colour theme" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z"/></svg></button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden><span class="nav-toggle-bars" aria-hidden="true"></span><span class="nav-toggle-label">Menu</span></button>
    </div>
    <nav id="site-nav" class="site-nav" aria-label="Main">{{{nav}}}</nav>
  </div>
</header>
<main id="main">
{{{content}}}
</main>
<footer class="site-footer">
  <div class="wrap footer-grid">
    <div class="footer-id">
      <p class="footer-brand">{{{logo}}}</p>
      <p>{{full_name}}<br>{{affiliation}}{{{address}}}</p>
    </div>
    <ul class="footer-links">
      <li><a href="mailto:{{email}}">{{email}}</a></li>
      <li><a href="{{github}}" rel="noopener">The lab on GitHub</a></li>
      <li><a href="{{pi_site}}" rel="noopener">{{pi_name}}</a></li>
    </ul>
    <ul class="footer-nav">{{{footer_nav}}}</ul>
  </div>
  <div class="wrap footer-base"><p>© {{year}} {{name}}, {{affiliation}}</p></div>
</footer>
<script src="{{root}}assets/site.js" defer></script>
</body>
</html>
